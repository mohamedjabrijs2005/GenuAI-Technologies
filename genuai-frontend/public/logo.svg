<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Path -->
  <path d="M 50 6 L 86 20 C 86 54 50 88 50 94 C 50 88 14 54 14 20 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Inner High-Tech Shield Inset -->
  <path d="M 50 14 L 80 25 C 80 52 50 80 50 85 C 50 80 20 52 20 25 Z" fill="#0f172a" fill-opacity="0.75" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Golden Core Circuit Emblem / G-Brain Monogram -->
  <g transform="translate(50, 48) scale(0.85)">
    <!-- Circuit nodes -->
    <circle cx="0" cy="-18" r="4.5" fill="url(#goldGrad)" />
    <circle cx="-16" cy="6" r="3.5" fill="url(#aiGrad)" />
    <circle cx="16" cy="6" r="3.5" fill="url(#aiGrad)" />
    <circle cx="0" cy="18" r="4" fill="url(#goldGrad)" />

    <!-- Connecting Circuit Lines -->
    <path d="M 0 -18 L -16 6 L 0 18 L 16 6 L 0 -18" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -16 6 L 16 6" fill="none" stroke="url(#aiGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Center AI Spark Core -->
    <circle cx="0" cy="6" r="6" fill="#ffffff" filter="url(#glow)" />
    <circle cx="0" cy="6" r="3.5" fill="#4f46e5" />
  </g>
</svg>
